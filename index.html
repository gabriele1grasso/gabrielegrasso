<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#5e41e3" />
    <!-- Titolo, descrizione, canonical e og:title/description/url li imposta ogni pagina (components/layout/seo.tsx) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gabriele Grasso" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="https://gabrielegrasso.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Il Protocollo 3P: la guida per rimettere in ordine Meta Ads" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- iubenda (banner cookie + blocco automatico + Consent Mode v2 di Google). Deve restare
         il primo script della pagina, sincrono: blocca pixel di Meta e GA4 finché il visitatore
         non dà il consenso. -->
    <script type="text/javascript" src="https://embeds.iubenda.com/widgets/770fc140-bbf1-4a74-b893-9b95e94a1842.js"></script>
    <!-- Pixel di Meta "Pixel Gabriele Grasso": PageView al caricamento di ogni pagina.
         I cambi di pagina interni (senza ricarica) li invia components/layout/meta-pixel.tsx -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1838141280906514');
      fbq('track', 'PageView');
    </script>
    <!-- Google Analytics 4 (G-6QERTEGXL3). Lo script parte dopo il caricamento della pagina,
         per non pesare su PageSpeed. I cambi di pagina interni li rileva GA4 da solo
         (misurazione avanzata). Il clic sui pulsanti verso il checkout di Systeme si registra
         come "clic_acquista": l'evento begin_checkout parte già sulla pagina di Systeme. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6QERTEGXL3');
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6QERTEGXL3';
        document.head.appendChild(s);
      });
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href*="checkout.gabrielegrasso.com"]');
        if (a) gtag('event', 'clic_acquista', { link_url: a.href, transport_type: 'beacon' });
      });
      // "sezione_vista": una volta per visita, quando il titolo di una sezione arriva a metà
      // schermo. Serve a capire fin dove scorrono i visitatori (parametro "sezione" = titolo).
      window.addEventListener('load', function () {
        if (!('IntersectionObserver' in window)) return;
        var viste = {};
        var oss = new IntersectionObserver(function (voci) {
          voci.forEach(function (v) {
            if (!v.isIntersecting) return;
            var nome = (v.target.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 60);
            oss.unobserve(v.target);
            if (!nome || viste[nome]) return;
            viste[nome] = true;
            gtag('event', 'sezione_vista', { sezione: nome });
          });
        }, { rootMargin: '0px 0px -50% 0px' });
        document.querySelectorAll('main h1, main h2, #root h1, #root h2').forEach(function (t) { oss.observe(t); });
      });
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
